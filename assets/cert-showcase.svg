<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" role="img"
     aria-label="Credential card: SQL (Advanced), HackerRank skill certification, verified">
  <title>SQL (Advanced) — HackerRank</title>
  <defs>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="190" x2="520" y2="0">
      <stop offset="0"   stop-color="#ffae00"/>
      <stop offset="0.5" stop-color="#7e03aa"/>
      <stop offset="1"   stop-color="#00fffb"/>
    </linearGradient>
    <!-- objectBoundingBox so the sheen travels with the band -->
    <linearGradient id="sheen">
      <stop offset="0"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="2" y="2" width="516" height="186" rx="11"/></clipPath>
  </defs>

  <rect x="2" y="2" width="516" height="186" rx="11" fill="#0d1117" stroke="url(#edge)" stroke-width="2.5"/>

  <!-- holographic sweep -->
  <g clip-path="url(#card)">
    <rect y="-50" width="120" height="290" fill="url(#sheen)" transform="skewX(-16)">
      <animate attributeName="x" from="-190" to="620" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- issuer -->
  <text x="30" y="42" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11.5"
        font-weight="bold" letter-spacing="2.4" fill="#6ee7f9">HACKERRANK</text>

  <!-- verified pill -->
  <rect x="384" y="26" width="106" height="23" rx="11.5" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
  <text x="437" y="41.5" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif"
        font-size="10" font-weight="bold" letter-spacing="1.1" fill="#4ade80">✓ VERIFIED</text>

  <!-- credential -->
  <text x="30" y="92" font-family="Verdana,DejaVu Sans,sans-serif" font-size="27"
        font-weight="bold" fill="#f0f6fc">SQL (Advanced)</text>

  <line x1="30" y1="112" x2="490" y2="112" stroke="#30363d" stroke-width="1"/>

  <text x="30" y="137" font-family="Verdana,DejaVu Sans,sans-serif" font-size="12.5" fill="#8b949e">
    Window functions, CTEs, and query plans I can defend
  </text>

  <!-- footer meta -->
  <text x="30" y="165" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11"
        letter-spacing="1.2" fill="#fe428e">1 OF 4 · HACKERRANK TRACK</text>
  <text x="490" y="165" text-anchor="end" font-family="Verdana,DejaVu Sans,sans-serif"
        font-size="11" letter-spacing="1.2" fill="#8b949e">SKILL CERTIFICATION</text>
</svg>
