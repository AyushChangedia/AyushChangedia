<svg xmlns="http://www.w3.org/2000/svg" width="560" height="95" viewBox="0 0 560 95" role="img" aria-label="The limit is only your imagination — Tony Robbins">
  <title>The limit is only your imagination — Tony Robbins</title>

  <!-- card -->
  <rect x="0.75" y="0.75" width="558.5" height="93.5" rx="5"
        fill="#141321" stroke="#a9fef7" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- flanking quote marks, sharing one baseline -->
  <text x="96" y="52" font-family="Georgia,DejaVu Serif,serif" font-size="40" fill="#fe428e">&#8220;</text>
  <text x="446" y="52" font-family="Georgia,DejaVu Serif,serif" font-size="40" fill="#fe428e">&#8221;</text>

  <!-- quote -->
  <text x="280" y="44" text-anchor="middle"
        font-family="Georgia,DejaVu Serif,serif" font-style="italic"
        font-size="19" fill="#a9fef7">The limit is only your imagination</text>

  <!-- attribution -->
  <text x="280" y="76" text-anchor="middle"
        font-family="Georgia,DejaVu Serif,serif" font-style="italic"
        font-size="14" fill="#fe428e">&#8212; Tony Robbins</text>
</svg>
